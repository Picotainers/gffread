name: Build and Publish gffread

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build smoke-test image
        run: docker build -t picotainers-local/gffread:smoke .

      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p testdata
          printf 'chr1\tsource\ttranscript\t1\t10\t.\t+\t.\tgene_id "g1"; transcript_id "t1";\n' > testdata/input.gtf
          printf 'chr1\tsource\texon\t1\t10\t.\t+\t.\tgene_id "g1"; transcript_id "t1";\n' >> testdata/input.gtf

          docker run --rm picotainers-local/gffread:smoke gffread --help > testdata/help.txt 2>&1
          grep -qi 'gffread' testdata/help.txt

          docker run --rm -v "$PWD/testdata:/data" picotainers-local/gffread:smoke \
            gffread /data/input.gtf -T -o /data/output.gff3
          test -s testdata/output.gff3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: docker.io/picotainers/gffread:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
